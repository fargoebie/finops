version: 2

sources:
  - name: gcp_billing
    description: "GCP FOCUS billing export in BigQuery."
    database: "{{ env_var('DBT_BILLING_PROJECT_ID', 'terra-coe-finops') }}"
    schema: "{{ env_var('DBT_BILLING_DATASET', 'gcp_billing_immutable_01A09A_A37EA6_F0AC6C_asia_southeast2') }}"
    tables:
      - name: focus_export
        identifier: "{{ env_var('DBT_FOCUS_TABLE', 'gcp_billing_export_focus_01A09A_A37EA6_F0AC6C') }}"
        description: >
          GCP FOCUS 1.0 billing export. ChargeCategory is the main classification
          (Usage/Purchase/Tax/Credit/Adjustment). Credits are embedded in Usage rows
          via x_Credits REPEATED RECORD, not as separate Credit rows.
