version: 2

models:
  - name: fct_spend_waterfall
    description: "Monthly spend waterfall per project/service/sku: list→contracted→effective→billed."
    columns:
      - name: project_id
        tests: [not_null]
      - name: charge_month
        tests: [not_null]
      - name: billed_cost
        tests: [not_null]

  - name: fct_credit_breakdown
    description: "Credits by type/project/service/month. credit_amount is negative."
    columns:
      - name: project_id
        tests: [not_null]
      - name: credit_type
        tests: [not_null]
      - name: total_credit_amount
        tests: [not_null]

  - name: fct_commitment_discounts
    description: "CUD credits by project/service/month from x_Credits UNNEST."
    columns:
      - name: commitment_discount_type
        tests: [not_null]

  - name: fct_monthly_showback
    description: "Project-level monthly showback with credit attribution waterfall."
    columns:
      - name: project_id
        tests: [not_null]
      - name: charge_month
        tests: [not_null]
      - name: net_cost
        tests: [not_null]

  - name: fct_customer_monthly
    description: "Customer × platform × month BOD mart. Primary source for board dashboards."
    columns:
      - name: customer_name
        tests: [not_null]
      - name: effective_discount_pct
        description: "Per-row diagnostic only. Do NOT average across rows; aggregate as 1 - SUM(effective_cost_idr)/SUM(gross_cost_idr)."
      - name: platform
        tests:
          - not_null
          - accepted_values:
              values: ['GCP', 'GMP']
      - name: charge_month
        tests: [not_null]
      - name: billing_account_id
        tests: [not_null]
      - name: billing_account_name
        description: "Cloud Billing displayName, from the billing_accounts seed. '(unnamed)' if the API list is stale."
        tests: [not_null]
      - name: account_class
        description: "production | trial | internal. 'unclassified' flags a billing account with no customer_accounts.csv row."
        tests:
          - not_null
          - accepted_values:
              values: ['production', 'trial', 'internal', 'unclassified']
      - name: is_credit_funded
        description: "True when PROMOTION (sales) credits absorb >=50% of list cost. Such accounts bill near zero — exclude or segment them in net-cost rankings."
        tests: [not_null]
      - name: promo_credit_coverage_pct
        description: "Share of list cost absorbed by PROMOTION credits. Per-row diagnostic; aggregate as -SUM(promo_credits_idr)/SUM(gross_cost_idr)."

  - name: fct_credit_runway
    description: "Sales/promotional credit runway per credit × billing account. Burn is observed from the export; total_amount_idr, start_date and end_date are transcribed by hand into the credit_programs seed (no API exposes them), so runway columns are NULL until filled."
    columns:
      - name: credit_id
        tests: [not_null]
      - name: billing_account_id
        tests: [not_null]
      - name: is_active
        description: "Credit still applying as of the last complete export day."
        tests: [not_null]
      - name: is_unseeded
        description: "Credit observed in the export with no credit_programs row — amount and end date unknown."
        tests: [not_null]
      - name: runway_days
        description: "Days until the credit runs out of money or reaches end_date, whichever is sooner. NULL when neither is known (amount and end_date both untranscribed)."

  - name: fct_customer_service_month
    description: "Customer × platform × service × month service-trend mart."
    columns:
      - name: customer_name
        tests: [not_null]
      - name: platform
        tests:
          - not_null
          - accepted_values:
              values: ['GCP', 'GMP']
      - name: charge_month
        tests: [not_null]
      - name: service_name
        tests: [not_null]
