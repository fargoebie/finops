version: 2

models:
  - name: fct_spend_waterfall
    description: "Monthly spend waterfall per project/service/sku: list→contracted→effective→billed."
    columns:
      - name: project_id
        tests: [not_null]
      - name: charge_month
        tests: [not_null]
      - name: billed_cost
        tests: [not_null]

  - name: fct_credit_breakdown
    description: "Credits by type/project/service/month. credit_amount is negative."
    columns:
      - name: project_id
        tests: [not_null]
      - name: credit_type
        tests: [not_null]
      - name: total_credit_amount
        tests: [not_null]

  - name: fct_commitment_discounts
    description: "CUD credits by project/service/month from x_Credits UNNEST."
    columns:
      - name: commitment_discount_type
        tests: [not_null]

  - name: fct_monthly_showback
    description: "Project-level monthly showback with credit attribution waterfall."
    columns:
      - name: project_id
        tests: [not_null]
      - name: charge_month
        tests: [not_null]
      - name: net_cost
        tests: [not_null]

  - name: fct_customer_monthly
    description: "Customer × platform × month BOD mart. Primary source for board dashboards."
    columns:
      - name: customer_name
        tests: [not_null]
      - name: effective_discount_pct
        description: "Per-row diagnostic only. Do NOT average across rows; aggregate as 1 - SUM(effective_cost_idr)/SUM(gross_cost_idr)."
      - name: platform
        tests:
          - not_null
          - accepted_values:
              values: ['GCP', 'GMP']
      - name: charge_month
        tests: [not_null]
      - name: billing_account_id
        tests: [not_null]

  - name: fct_customer_service_month
    description: "Customer × platform × service × month service-trend mart."
    columns:
      - name: customer_name
        tests: [not_null]
      - name: platform
        tests:
          - not_null
          - accepted_values:
              values: ['GCP', 'GMP']
      - name: charge_month
        tests: [not_null]
      - name: service_name
        tests: [not_null]
