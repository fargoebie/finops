name: 'finops'
version: '1.0.0'
config-version: 2

profile: 'finops'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # UTC midnight. stg_focus_billing reads finops_history.focus_billing_history before this
  # instant and the live FOCUS export from it onward. Must equal the cutover in
  # tools/history_backfill/02_convert.sql (tools/history_backfill/check_schema.py checks).
  focus_cutover_date: '2026-07-26'

seeds:
  finops:
    customer_accounts:
      +schema: finops_dbt
      +column_types:
        billing_account_id: string
        customer_name: string
        customer_id: string
        account_class: string
        notes: string
    # CURATED by hand: amount/start_date/end_date are transcribed from
    # Console → Billing → Credits (no API exposes them). Never auto-generate.
    credit_programs:
      +schema: finops_dbt
      +column_types:
        credit_id: string
        credit_name: string
        billing_account_id: string
        total_amount_idr: numeric
        start_date: date
        end_date: date
        notes: string
    # GENERATED by scripts/refresh_billing_accounts.sh — do not hand-edit.
    billing_accounts:
      +schema: finops_dbt
      +column_types:
        billing_account_id: string
        billing_account_name: string
        master_billing_account_id: string
        is_open: boolean

models:
  finops:
    # Intermediate and mart models are tables, not views: a view re-scans the raw billing
    # rows on every query (docs/plans/dbt-cost-materialization.md). stg_focus_billing,
    # int_charges and int_credits are incremental tables, set in their own config.
    staging:
      +materialized: view
      +schema: dbt_staging
    intermediate:
      +materialized: table
      +schema: dbt_intermediate
    marts:
      +materialized: table
      +schema: finops_dbt
