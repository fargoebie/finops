name: 'finops'
version: '1.0.0'
config-version: 2

profile: 'finops'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  finops:
    customer_accounts:
      +schema: finops_dbt
      +column_types:
        billing_account_id: string
        customer_name: string
        customer_id: string
        account_class: string
        notes: string
    # CURATED by hand: amount/start_date/end_date are transcribed from
    # Console → Billing → Credits (no API exposes them). Never auto-generate.
    credit_programs:
      +schema: finops_dbt
      +column_types:
        credit_id: string
        credit_name: string
        billing_account_id: string
        total_amount_idr: numeric
        start_date: date
        end_date: date
        notes: string
    # GENERATED by scripts/refresh_billing_accounts.sh — do not hand-edit.
    billing_accounts:
      +schema: finops_dbt
      +column_types:
        billing_account_id: string
        billing_account_name: string
        master_billing_account_id: string
        is_open: boolean

models:
  finops:
    staging:
      +materialized: view
      +schema: dbt_staging
    intermediate:
      +materialized: view
      +schema: dbt_intermediate
    marts:
      +materialized: view
      +schema: finops_dbt
