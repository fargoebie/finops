# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS reverse proxy to Metabase on localhost:3000.
# Ships with a self-signed cert (generated by vm-startup.sh) so TLS is up by
# default. Upgrade to a trusted cert with: certbot --nginx -d YOUR_DOMAIN
# (certbot rewrites the ssl_certificate paths below to /etc/letsencrypt/...).
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/metabase-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/metabase-selfsigned.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Metabase requires large payloads for dashboard exports
    client_max_body_size 16m;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
